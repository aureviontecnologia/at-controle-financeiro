name: Sincronizar versao 1.0.5

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-v1.0.5.yml']

permissions:
  contents: write

jobs:
  sync:
    if: "github.event.head_commit.message == 'chore: prepare v1.0.5 sync fix'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar codigo validado
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://at-controle-financeiro-aurevion.aureviontecnologia.workers.dev/releases/aurevion-v1.0.5.patch' -o /tmp/update.patch
          echo '0790cb16056d10c8c9c4af6592b4d9f12e0226a3098727916f079afda8765c6b  /tmp/update.patch' | sha256sum -c -
          git apply --check /tmp/update.patch
          git apply /tmp/update.patch
          git config user.name 'Aurevion Release Bot'
          git config user.email 'aurevion@users.noreply.github.com'
          git add -A
          git rm .github/workflows/sync-v1.0.5.yml
          git commit -m 'feat: add shared subscriptions and savings pots'
          git push origin HEAD:main
