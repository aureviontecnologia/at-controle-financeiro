<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#090b0c;color:#f5f7f6;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <div style="font-size:28px;font-weight:700;letter-spacing:-1px">Saldo.</div>
      <p style="margin:32px 0 8px;font-size:22px;font-weight:700">Recupere seu acesso</p>
      <p style="margin:0 0 24px;color:#9aa29f;line-height:1.6">Use o código abaixo no aplicativo. Ele é temporário e deve ser usado somente por você.</p>
      <div style="padding:20px;border:1px solid #2b3134;border-radius:12px;background:#111416;text-align:center;font-size:30px;font-weight:700;letter-spacing:8px">{{ .Token }}</div>
      <p style="margin:24px 0;color:#9aa29f;line-height:1.6">Ou abra diretamente a tela segura:</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 20px;border-radius:10px;background:#8be3b6;color:#090b0c;text-decoration:none;font-weight:700">Criar nova senha</a>
      <p style="margin-top:32px;color:#68716d;font-size:12px;line-height:1.6">Se você não pediu esta recuperação, ignore este email. O Saldo. nunca solicita sua senha por mensagem.</p>
    </div>
  </body>
</html>
